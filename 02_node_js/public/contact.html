<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Haunted Horizons</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="page shell contact-page">
        <nav class="top-nav">
            <a href="index.html" class="brand">Haunted Horizons</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>

        <section class="hero contact-hero">
            <div class="hero-copy">
                <span class="eyebrow">Reach out by midnight</span>
                <h1>Plan your next haunted adventure.</h1>
                <p>Use the form below to request a guided nighttime tour. This page is static, so no details are stored — just a spooky experience.</p>
            </div>
            <div class="contact-card">
                <div class="contact-image">
                    <img src="images/5.jpg" alt="Haunted corridor">
                </div>
                <form id="contact-form" class="contact-form">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    <label for="date">Preferred date</label>
                    <input type="date" id="date" name="date" required>

                    <label for="message">Tell us your ghost story</label>
                    <textarea id="message" name="message" rows="5" placeholder="What would you like to explore?" required></textarea>

                    <button type="submit" class="btn">Send request</button>
                    <p id="contact-response" class="response-text"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <p>&copy; 2026 Haunted Horizons. Your journey begins after dusk.</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
